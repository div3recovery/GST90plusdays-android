name: Build 90+ Days GST Recovery APK

on:
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [ main ]

permissions:
  contents: write           # to publish the APK on the Releases page

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gst90.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/gst90.p12" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Name the file
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/90plus-Days-GST-Recovery.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: 90plus-Days-GST-Recovery-${{ github.run_number }}
          path: out/

      - name: Publish on the Releases page (download link stays the same for every version)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 90+ Days GST Recovery 1.0.${{ github.run_number }}
          body: "Android app for 90+ Days GST Recovery – Gandhinagar Division. Download 90plus-Days-GST-Recovery.apk below."
          files: out/90plus-Days-GST-Recovery.apk
          make_latest: true
